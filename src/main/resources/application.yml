server:
  port: ${PORT:8080} # hosting platforms such as Render inject PORT

spring:
  application:
    name: smart-medical-appointment-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 86400000 # 24 hours in milliseconds

# Keep-alive: pings <url>/api/health so a free host does not sleep and a free
# database does not power off. Render sets RENDER_EXTERNAL_URL automatically;
# when no URL is available (local runs) the ping is disabled.
keepalive:
  url: ${KEEPALIVE_URL:${RENDER_EXTERNAL_URL:}}
  interval-ms: ${KEEPALIVE_INTERVAL_MS:600000} # 10 minutes (Render sleeps after 15)

---
# MySQL Production / Primary Profile (Default)
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smartmedical_db}?createDatabaseIfNotExist=true&sslMode=${DB_SSL_MODE:DISABLED}&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      continue-on-error: true

---
# Dev / Demo Profile (Self-contained in-memory database for immediate evaluation)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:smartmedical_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      continue-on-error: true