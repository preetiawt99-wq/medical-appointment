<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Doctor Slots - SmartMed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/doctor/dashboard.html"><i class="bi bi-heart-pulse-fill me-2"></i>SmartMed Doctor Portal</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/doctor/dashboard.html"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/doctor/appointments.html"><i class="bi bi-calendar-week me-1"></i>Patient Appointments</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/doctor/availability.html"><i class="bi bi-clock-history me-1"></i>Manage Slots</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="text-white me-3 small"><i class="bi bi-person-badge me-1"></i><span class="doctor-name-display">Doctor</span></span>
                    <button class="btn btn-outline-light btn-sm" onclick="API.logout()"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-content container py-4" id="availabilitySection">
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card p-4 shadow-sm border-0 bg-white">
                    <h5 class="fw-bold mb-3"><i class="bi bi-plus-circle text-primary me-2"></i>Add Availability Slot</h5>
                    <div id="slotAlert" class="alert d-none"></div>

                    <form id="addSlotForm">
                        <div class="mb-3">
                            <label for="newSlotDate" class="form-label fw-semibold">Slot Date *</label>
                            <input type="date" id="newSlotDate" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="newSlotTime" class="form-label fw-semibold">Slot Time *</label>
                            <input type="time" id="newSlotTime" class="form-control" required>
                        </div>
                        <button type="submit" id="addSlotBtn" class="btn btn-primary w-100 fw-semibold">
                            Create Slot
                        </button>
                    </form>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card p-4 shadow-sm border-0 bg-white">
                    <h5 class="fw-bold mb-3"><i class="bi bi-clock-history text-secondary me-2"></i>Configured Time Slots</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Slot ID</th>
                                    <th>Date</th>
                                    <th>Time</th>
                                    <th>Booking Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="slotsTableBody">
                                <tr><td colspan="5" class="text-center py-3 text-muted">Loading slots...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center"><div class="container"><p class="mb-0 text-muted small">Smart Medical Appointment & Risk Prediction System &copy; 2026</p></div></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/doctor.js"></script>
</body>
</html>
