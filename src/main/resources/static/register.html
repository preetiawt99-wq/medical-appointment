<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration - SmartMed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/index.html">
                <i class="bi bi-heart-pulse-fill me-2"></i>SmartMed Portal
            </a>
            <span class="badge bg-light text-primary">Patient Registration</span>
        </div>
    </nav>

    <div class="main-content container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card p-4 shadow-lg border-0 bg-white">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold">Create Patient Account</h3>
                        <p class="text-muted small">Register to book medical appointments and access risk triage</p>
                    </div>

                    <div id="regAlert" class="alert d-none" role="alert"></div>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="regName" class="form-label fw-semibold">Full Name *</label>
                            <input type="text" class="form-control" id="regName" placeholder="e.g. Preeti Sharma" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="regEmail" class="form-label fw-semibold">Email Address *</label>
                                <input type="email" class="form-control" id="regEmail" placeholder="patient@example.com" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="regPassword" class="form-label fw-semibold">Password *</label>
                                <input type="password" class="form-control" id="regPassword" minlength="6" placeholder="Min 6 characters" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="regMobile" class="form-label fw-semibold">Mobile Number *</label>
                                <input type="tel" class="form-control" id="regMobile" placeholder="+91 9876543210" required>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label for="regAge" class="form-label fw-semibold">Age *</label>
                                <input type="number" class="form-control" id="regAge" min="1" max="120" placeholder="25" required>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label for="regGender" class="form-label fw-semibold">Gender *</label>
                                <select id="regGender" class="form-select" required>
                                    <option value="" disabled selected>Select</option>
                                    <option value="Female">Female</option>
                                    <option value="Male">Male</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-7 mb-3">
                                <label for="regAddress" class="form-label fw-semibold">Address / City</label>
                                <input type="text" class="form-control" id="regAddress" placeholder="e.g. Rohini, New Delhi">
                            </div>
                            <div class="col-md-5 mb-3">
                                <label for="regBloodGroup" class="form-label fw-semibold">Blood Group</label>
                                <select id="regBloodGroup" class="form-select">
                                    <option value="" selected>Select (Optional)</option>
                                    <option value="A+">A+</option>
                                    <option value="A-">A-</option>
                                    <option value="B+">B+</option>
                                    <option value="B-">B-</option>
                                    <option value="AB+">AB+</option>
                                    <option value="AB-">AB-</option>
                                    <option value="O+">O+</option>
                                    <option value="O-">O-</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="regMedicalHistory" class="form-label fw-semibold">Known Medical History / Chronic Conditions</label>
                            <textarea class="form-control" id="regMedicalHistory" rows="2" placeholder="e.g. Hypertension, Asthma, Type 2 Diabetes, or None (Optional)"></textarea>
                        </div>

                        <button type="submit" id="regSubmitBtn" class="btn btn-primary w-100 py-2 fw-semibold">
                            Create Account
                        </button>
                    </form>

                    <div class="text-center mt-3 pt-2">
                        <span class="text-muted small">Already registered?</span>
                        <a href="/index.html" class="fw-bold text-decoration-none ms-1">Login here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center">
        <div class="container">
            <p class="mb-0 text-muted small">Smart Medical Appointment & Risk Prediction System &copy; 2026</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
